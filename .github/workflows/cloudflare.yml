name: Deploy to Cloudflare Pages

# Production: every push to main → migrations, then deploy to plantt.oa.dev.
# Preview: every same-repo pull request → its own <branch>.plantt.pages.dev URL,
# bound to the separate `plantt-preview` D1 database (see wrangler.toml [env.preview]).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Forked PRs have no access to the deploy token; skip them rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test          # schema/op consistency — fails the deploy on model drift
      - run: npm run build

      - name: Apply D1 migrations (production)
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply plantt --remote
      - name: Apply D1 migrations (preview)
        if: github.event_name == 'pull_request'
        run: npx wrangler d1 migrations apply plantt-preview --remote --env preview

      - name: Deploy
        run: >
          npx wrangler pages deploy dist
          --project-name plantt
          --branch "${{ github.head_ref || github.ref_name }}"
          --commit-hash "${{ github.event.pull_request.head.sha || github.sha }}"
