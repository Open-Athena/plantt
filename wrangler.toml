# Cloudflare Pages project `plantt` (Open Athena account), served at plantt.oa.dev.
# Static site = dist/ (Vite), API = functions/ (Pages Functions), storage = D1.
# See docs/multiuser-plan.md.
name = "plantt"
compatibility_date = "2026-06-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "plantt"
database_id = "99583dd5-b2ad-451f-b8e8-5691a4a11b0b"
migrations_dir = "migrations"

[vars]
ADMIN_LOGINS = "ihodes"          # comma-separated GitHub logins; always admitted, always admin
GITHUB_ORG = "Open-Athena"       # active members are admitted without an allowlist row
PUBLIC_ORIGIN = "https://plantt.oa.dev"
GITHUB_CLIENT_ID = "Ov23ligEadoQaStH0HVf"   # public identifier of the org-owned OAuth app

# Secrets (set with `npx wrangler pages secret put <NAME> --project-name plantt`;
# local dev reads them from .dev.vars, which is gitignored):
#   SESSION_SECRET        HMAC key for session cookies and IP hashing (openssl rand -base64 32)
#   GITHUB_CLIENT_SECRET

# PR preview deployments get their own database so previews never touch production data.
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "plantt-preview"
database_id = "e86fbfbb-965f-4c09-87bf-7eccd5f3f194"
migrations_dir = "migrations"

[env.preview.vars]
ADMIN_LOGINS = "ihodes"
GITHUB_ORG = "Open-Athena"
PUBLIC_ORIGIN = ""               # previews: derive from the request
GITHUB_CLIENT_ID = "Ov23ligEadoQaStH0HVf"
